services:

  database:
    image: mariadb:11
    container_name: easycrud-database
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: student_db
      MARIADB_USER: linux
      MARIADB_PASSWORD: redhat
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - easycrud-network

  backend:
    build:
      context: ./backend
    container_name: easycrud-backend
    restart: unless-stopped
    depends_on:
      - database
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/student_db
      SPRING_DATASOURCE_USERNAME: linux
      SPRING_DATASOURCE_PASSWORD: redhat
    ports:
      - "8080:8080"
    networks:
      - easycrud-network

  frontend:
    build:
      context: ./frontend
    container_name: easycrud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - easycrud-network

volumes:
  mariadb_data:

networks:
  easycrud-network:
    driver: bridge


